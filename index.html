<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritmo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div>
      <h1>Ritmo</h1>
      <p>Board Kanban que mede sozinho e prevê o futuro.</p>
    </div>
    <button id="sair" type="button" hidden>Sair</button>
  </header>

  <main>
    <!-- Mensagens de erro e avisos. aria-live faz o leitor de tela anunciar. -->
    <p id="status" role="status" aria-live="polite"></p>

    <!-- Tela 1: entrar ou criar conta -->
    <section id="tela-entrar" class="tela" hidden>
      <h2 id="titulo-entrar">Entrar</h2>
      <form id="form-entrar" class="formulario" novalidate>
        <label id="campo-nome" hidden>Seu nome
          <input id="nome" type="text" autocomplete="name">
        </label>
        <label>E-mail
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>Senha
          <input id="senha" type="password" autocomplete="current-password" required>
        </label>
        <button id="botao-entrar" type="submit">Entrar</button>
      </form>
      <button id="trocar-modo" type="button" class="link">Criar uma conta</button>
    </section>

    <!-- Tela 2: meus boards -->
    <section id="tela-boards" class="tela" hidden>
      <h2>Meus boards</h2>
      <ul id="lista-boards" class="lista-boards"></ul>
      <form id="form-board" class="formulario em-linha" novalidate>
        <label>Nome do novo board
          <input id="nome-board-novo" type="text">
        </label>
        <button type="submit">Criar board</button>
      </form>
      <!-- História 2: entrar no board de um colega pelo código de convite -->
      <form id="form-convite" class="formulario em-linha" novalidate>
        <label>Código de convite
          <!-- Sem maxlength: quem cola o código com espaço junto (" ab12cd ") perderia o fim.
               O tamanho é conferido por validarCodigoConvite (regras.js). -->
          <input id="codigo-convite" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false">
        </label>
        <button type="submit">Entrar no board</button>
      </form>
    </section>

    <!-- Tela 3: o board com as colunas -->
    <section id="tela-board" class="tela" hidden>
      <div class="topo-board">
        <button id="voltar" type="button">← Meus boards</button>
        <h2 id="nome-board"></h2>
      </div>
      <!-- História 2: código para convidar o time e quem já está no board -->
      <div class="time-board">
        <p>Código de convite: <strong id="codigo-board" class="codigo"></strong></p>
        <p id="titulo-membros">Membros</p>
        <ul id="lista-membros" class="lista-membros" aria-labelledby="titulo-membros"></ul>
      </div>
      <!-- História 3: o cartão novo entra na primeira coluna do board -->
      <form id="form-cartao" class="formulario em-linha" novalidate>
        <label>Novo cartão
          <input id="titulo-cartao-novo" type="text">
        </label>
        <label>Pontos (opcional)
          <input id="pontos-cartao-novo" type="text" inputmode="numeric" size="4">
        </label>
        <label>Responsável
          <select id="responsavel-novo"><option value="">Ninguém</option></select>
        </label>
        <button type="submit">Criar cartão</button>
      </form>
      <div id="quadro" class="quadro"></div>
      <form id="form-coluna" class="formulario em-linha" novalidate>
        <label>Nova coluna
          <input id="nome-coluna-nova" type="text">
        </label>
        <button type="submit">Adicionar coluna</button>
      </form>
      <section class="passagens" aria-labelledby="titulo-passagens">
        <h3 id="titulo-passagens">Passagens do limite de WIP (para o Scrum Master)</h3>
        <ul id="lista-passagens" class="lista-passagens"></ul>
      </section>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
